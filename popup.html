<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Prefixer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <!-- Sayfa 1: Prefix Listesi -->
        <div id="pageList" class="page active">
            <header>
                <div class="brand">
                    <div class="brand-logo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                    </div>
                    <h1>Download Prefixer</h1>
                </div>
                <span class="version-badge">v1.3.1</span>
            </header>

            <div class="rules-section">
                <div class="actions">
                    <div class="action-buttons-left">
                        <button id="exportRulesBtn" class="btn-icon" title="Kuralları Dışa Aktar">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7 10 12 15 17 10" />
                                <line x1="12" y1="15" x2="12" y2="3" />
                            </svg>
                        </button>
                        <button id="importRulesBtn" class="btn-icon" title="Kuralları İçe Aktar">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                        </button>
                        <input type="file" id="importFileInput" accept=".json" style="display: none;">
                    </div>
                    <button id="addPrefixBtn" class="btn btn-primary btn-sm">+ Prefix Ekle</button>
                </div>
                
                <div id="rulesList" class="rules-list">
                    <!-- Kurallar buraya dinamik olarak yüklenecek -->
                </div>
            </div>

            <div class="status">
                <div id="statusMessage" class="status-message"></div>
            </div>

            <footer>
                <p>İndirilen dosyalarınızı otomatik ve dinamik isimlendirin</p>
            </footer>
        </div>

        <!-- Sayfa 2: Prefix Ekleme -->
        <div id="pageAdd" class="page">
            <header>
                <div class="brand">
                    <button id="backBtn" class="btn-back" title="Geri">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </button>
                    <h1>Yeni Prefix Ekle</h1>
                </div>
            </header>

            <div class="add-rule-section">
                <div class="form-group">
                    <label for="domainInput">Site Domain / Maske:</label>
                    <input type="text" id="domainInput" placeholder="örnek: github.com">
                </div>
                <div class="form-group">
                    <label for="matchTypeSelect">Eşleşme Tipi:</label>
                    <select id="matchTypeSelect">
                        <option value="subdomain" selected>Alt Alan Adları Dahil (örnek.com & *.örnek.com)</option>
                        <option value="exact">Tam Eşleşme (Sadece örnek.com)</option>
                        <option value="wildcard">Wildcard / Joker (git*.com, *.org vb.)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fileExtensionInput">Dosya Uzantısı Filtresi (İsteğe Bağlı):</label>
                    <input type="text" id="fileExtensionInput" placeholder="örnek: pdf, zip (Tümü için boş bırakın)">
                </div>
                <div class="form-group">
                    <label for="prefixInput">Dosya Öneki (Prefix):</label>
                    <input type="text" id="prefixInput" placeholder="örnek: github_{date}_" autofocus>
                    <div class="form-helper">
                        <div class="helper-title">Dinamik Etiketler (Tıkla ve Ekle):</div>
                        <div class="helper-tags">
                            <span class="helper-tag" title="Güncel Tarih (YYYY-MM-DD)">{date}</span>
                            <span class="helper-tag" title="Güncel Saat (HH-MM-SS)">{time}</span>
                            <span class="helper-tag" title="Site Domaini">{domain}</span>
                            <span class="helper-tag" title="Dört Haneli Yıl">{year}</span>
                            <span class="helper-tag" title="İki Haneli Ay">{month}</span>
                            <span class="helper-tag" title="İki Haneli Gün">{day}</span>
                            <span class="helper-tag" title="Unix Zaman Damgası">{timestamp}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button id="saveRuleBtn" class="btn btn-primary">Kaydet</button>
                <button id="cancelBtn" class="btn btn-secondary">İptal</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
